name: Manual Vercel Storage Cleanup

on:
  workflow_dispatch:

jobs:
  delete-old-deployments:
    runs-on: ubuntu-latest
    steps:
      - name: Purge Deployments Prior to September 1, 2026
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          UNTIL_TS: 1788220800000
        run: |
          echo "Fetching deployments created prior to September 1, 2026..."

          # Vercel limit must be <= 100
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET \
            "https://api.vercel.com/v6/deployments?projectId=learn-maths-2026&until=${UNTIL_TS}&limit=100" \
            -H "Authorization: Bearer ${TOKEN}")

          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d: -f2)

          echo "HTTP Status: $STATUS"
          echo "Response Body Preview:"
          echo "$BODY" | head -n 30

          if [ "$STATUS" -ne 200 ]; then
            echo "API request failed with status $STATUS. Check the response body above."
            exit 1
          fi

          # Extract IDs cleanly using jq
          DEPLOYMENT_IDS=$(echo "$BODY" | jq -r '.deployments[].uid // empty')

          if [ -z "$DEPLOYMENT_IDS" ]; then
            echo "No deployments found matching criteria."
            exit 0
          fi

          COUNT=0
          for ID in $DEPLOYMENT_IDS; do
            echo "Deleting deployment: $ID"
            DEL_RESP=$(curl -s -X DELETE \
              "https://api.vercel.com/v13/deployments/${ID}" \
              -H "Authorization: Bearer ${TOKEN}")
            echo "Result: $DEL_RESP"
            COUNT=$((COUNT + 1))
          done

          echo "Successfully deleted $COUNT deployments."
